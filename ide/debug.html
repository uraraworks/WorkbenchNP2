<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC98Dev デバッガ実証</title>
  <link rel="stylesheet" href="./vendor/webnp2/style.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header><h1>PC98Dev デバッガ実証</h1><div id="status" role="status">初期化中…</div></header>
  <main>
    <section class="source-pane">
      <h2>samples/hello.asm</h2>
      <div class="controls">
        <button id="pause">Pause</button><button id="step" disabled>Step</button>
        <button id="next-line" disabled>次の行まで実行</button><button id="continue" disabled>BPまで実行</button>
        <button id="run" disabled>通常実行</button>
      </div>
      <div id="source" aria-label="アセンブリソース"></div>
    </section>
    <section class="runtime-pane">
      <div class="screen-card"><canvas id="screen" width="640" height="400" tabindex="0"></canvas></div>
      <div class="debug-card"><h2>レジスタ（IDE独自表示）</h2><div id="registers" class="ide-registers"></div>
        <h2>逆アセンブル（embed部品）</h2><div id="disassembly"></div></div>
    </section>
  </main>
  <pre id="screen-text" aria-label="PC-98テキスト画面"></pre>
  <script src="../toolchain/nasm-wasm/nasm.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
